name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard against tagging v1.2.3 while package.json still says 1.2.2,
      # which would silently publish a mismatched artifact name.
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package AppImage
        run: |
          npx electron-vite build
          npx electron-builder --linux AppImage --publish never

      - name: Generate checksum
        working-directory: dist
        run: sha256sum *.AppImage > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: openemeet ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          body: |
            ## Install

            ```bash
            chmod +x openemeet-*-x86_64.AppImage
            ./openemeet-*-x86_64.AppImage
            ```

            ### Required: udev rule

            Smart features (AI tracking, privacy, gestures, audio profiles) need
            access to the camera's `hidraw` node:

            ```bash
            sudo tee /etc/udev/rules.d/99-openemeet-pixy.rules > /dev/null <<'EOF'
            SUBSYSTEM=="hidraw", ATTRS{idVendor}=="328f", ATTRS{idProduct}=="00c0", MODE="0660", GROUP="video", TAG+="uaccess"
            SUBSYSTEM=="video4linux", ATTRS{idVendor}=="328f", ATTRS{idProduct}=="00c0", MODE="0660", GROUP="video", TAG+="uaccess"
            EOF
            sudo udevadm control --reload-rules && sudo udevadm trigger
            ```

            Then unplug and reconnect the camera. **Settings → System integration**
            verifies this for you.
